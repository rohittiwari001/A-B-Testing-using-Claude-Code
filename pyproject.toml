[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "abkit"
version = "0.1.0"
description = "Reusable A/B testing toolkit behind the Claude Code experimentation workflow"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "matplotlib>=3.7",
    "python-pptx>=0.6.23",
    "python-docx>=1.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools]
packages = ["abkit", "abkit.viz", "abkit.deck", "abkit.report"]

[tool.setuptools.package-data]
"abkit.viz" = ["*.mplstyle"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
